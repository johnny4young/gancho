# CI: lint + package tests on every event; app builds and UI regressions on
# pull requests that touch the app, all in one wave of macOS runners.
# Weekly run catches macOS runner-image drift before it bites a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC — image-drift canary

# Every other workflow scopes its token; this one ran on the default.
permissions:
  contents: read

# A newer push supersedes a pull request's run. Every other run gets its own
# group: a shared group drops its pending run even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Ubuntu decides whether the macOS app jobs run, so docs-only changes do not
  # queue behind the account's few concurrent macOS runners. A skipped required
  # job counts as passing. Pull requests build the apps and run the macOS UI
  # regressions; the slow iOS simulator job runs after the merge to main.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) endpoint="pulls/$PR/files" query='.[].filename' ;;
            push) endpoint="compare/$BEFORE...$AFTER" query='.files[].filename' ;;
            *) echo "app=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Fail open: an API error runs everything.
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/$endpoint" --jq "$query"); then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=false
          while IFS= read -r file; do
            case "$file" in
              *.md | docs/* | site/* | LICENSE) ;;
              *) app=true ;;
            esac
          done <<< "$files"
          echo "$files"
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Lint, package tests & coverage
    # The source uses macOS/iOS 26 APIs and keeps iOS at 26, while Swift 6.2
    # needs an Xcode 26 runner; macos-latest still cannot build this stack.
    runs-on: macos-26
    # Bounded so a hung xcodebuild or a stalled toolchain cannot burn the
    # 6-hour default at the 10x macOS billing rate. Generous vs the ~4 min
    # this job takes, so normal variance never trips it.
    timeout-minutes: 40
    # Pin the stable toolchain so weekly runner-image updates cannot silently
    # change the compiler or SDK used by required validation.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          {
            echo "### Toolchain"
            sw_vers
            xcodebuild -version
            swift --version
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: Packages/GanchoKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/GanchoKit/Package.swift', 'Packages/GanchoKit/Package.resolved') }}

      - name: Release metadata sync
        run: make release-check

      - name: Dependency resolution locks
        run: make dependency-check

      - name: Sparkle fetch cache regressions
        run: bash scripts/test-fetch-sparkle.sh

      - name: Website structure
        run: make site-check

      - name: Install SwiftLint
        run: brew install swiftlint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - name: Lint (swift-format)
        run: swift format lint --strict --recursive Apps Packages/GanchoKit/Sources Packages/GanchoKit/Tests Tests

      - name: Lint (SwiftLint)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Unit tests (Swift Testing, coverage on)
        run: |
          mkdir -p build
          set -o pipefail
          swift test --disable-automatic-resolution \
            --package-path Packages/GanchoKit --enable-code-coverage \
            2>&1 | tee build/package-test.log
          ./scripts/check-build-warnings.sh build/package-test.log

      # Scoped to PACKAGE sources — everything under
      # `Packages/GanchoKit/Sources/`, which is what `swift test` can reach.
      # The name used to say "production sources", which read as a claim about
      # the product: `Apps/**` is 19,021 lines, 46% of production code, and no
      # part of it is measured here. The weekly UI-test workflow reports that
      # half separately and does not gate on it.
      #
      # ~80.5% on this branch, so the 80% floor sits just below current
      # coverage. Raise it as the suite grows; never lower it to pass a PR.
      - name: Coverage gate (package sources >=80%)
        env:
          COVERAGE_FLOOR: "80"
        run: |
          ./scripts/check-coverage.sh --self-test
          ./scripts/check-coverage.sh
          # The app-half reporter runs only in the weekly UI workflow, so its
          # parsing is verified here instead — where a break is seen in hours
          # rather than the following Wednesday.
          ./scripts/report-apps-coverage.sh --self-test

      # Pull requests can restore only caches saved on main, and main no longer
      # runs the app jobs, so save the resolved app packages here on a miss.
      - name: Look up resolved app packages
        id: app-packages
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: build/xcode-packages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Dependencies/Package.resolved') }}
          lookup-only: true

      - name: Resolve app packages for pull requests
        if: github.event_name == 'push' && steps.app-packages.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          make project
          xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath build/xcode-packages \
            -project Gancho.xcodeproj -scheme Gancho

      - name: Save resolved app packages
        if: github.event_name == 'push' && steps.app-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/xcode-packages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Dependencies/Package.resolved') }}

  build-apps:
    name: Build macOS + iOS apps
    needs: changes
    # main's tree was already built and tested as an up-to-date pull request.
    if: github.event_name != 'push' && needs.changes.outputs.app == 'true'
    # SDK-26 APIs and Swift 6.2 need the Xcode 26 runner image. Pin it explicitly.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # Route the StoreKit step's `make test-storekit` into the same cloned
      # package directory as the builds below, so the whole job resolves
      # the dependency graph once. The Makefile declares this with `?=`, so the
      # environment wins.
      XCODE_PACKAGE_FLAGS: >-
        -disableAutomaticPackageResolution
        -clonedSourcePackagesDirPath build/xcode-packages
        COMPILER_INDEX_STORE_ENABLE=NO
    steps:
      - uses: actions/checkout@v7

      # xcodebuild resolves the app-wide graph into its cloned-source-packages
      # directory, keyed on the app lock. The bulk of it is the GRDB fork's
      # history, which is otherwise re-cloned on every run.
      - name: Cache resolved Swift packages
        uses: actions/cache@v6
        with:
          path: build/xcode-packages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Dependencies/Package.resolved') }}

      - name: Generate project
        run: |
          brew install xcodegen
          make project

      - name: Verify evidence collector
        run: ./scripts/collect-ui-test-evidence.sh --self-test

      - name: StoreKit purchase and entitlement tests
        run: |
          ./scripts/run-storekit-tests-ci.sh --self-test
          ./scripts/run-storekit-tests-ci.sh

      # One build serves both the warning gate and the UI regressions. It gets
      # its own DerivedData: after the StoreKit build, the shared one reports
      # the SQLCipher module as out of date (missing GRDBSQLCipher).
      - name: Build macOS app and UI tests
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild $XCODE_PACKAGE_FLAGS \
            build-for-testing -project Gancho.xcodeproj -scheme Gancho \
            -derivedDataPath build/mac-ui \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/mac.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee build/mac-build.log
          ./scripts/check-build-warnings.sh build/mac-build.log

      - name: Run macOS UI regressions
        env:
          TEST_RUNNER_GANCHO_UI_ADHOC_SIGNING: "1"
        run: |
          set -o pipefail
          xcodebuild $XCODE_PACKAGE_FLAGS \
            test-without-building -project Gancho.xcodeproj -scheme Gancho \
            -derivedDataPath build/mac-ui \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -only-testing:GanchoUITests/AppQualityUITests \
            -only-testing:GanchoUITests/BoardNameUITests/testLibraryBoardNamesEnglish \
            -only-testing:GanchoUITests/BoardNameUITests/testPanelBoardNamesEnglish \
            -only-testing:GanchoUITests/VisualLibraryUITests \
            -only-testing:GanchoUITests/SelectedContextUITests/testRecognizedTextNeedsApprovalBeforeCopyOrGrant \
            -only-testing:GanchoUITests/SelectedContextUITests/testReviewedImageIsGrantedButNotCopied \
            -only-testing:GanchoUITests/PanelDisplayPreferencesUITests/testPanelSizeAndTextSizePersistAcrossRelaunch \
            -only-testing:GanchoUITests/LibrarySnippetDraftUITests/testTypedBodySurvivesRefreshAndSavesOnSelectionChange \
            -only-testing:GanchoUITests/LibrarySnippetDraftUITests/testFailedNavigationSaveKeepsEditedSnippet \
            -only-testing:GanchoUITests/ActivationFunnelUITests \
            -only-testing:GanchoUITests/SettingsPrivacyUITests/testStatusTilesAndThePrivacyCenterCard \
            -only-testing:GanchoUITests/SettingsPrivacyUITests/testPrivateModeAutoOffDefaultsToOneHour \
            -only-testing:GanchoUITests/MigrationImportUITests/testOnboardingOffersGuidedMigration \
            -only-testing:GanchoUITests/MigrationImportUITests/testApprovedImportShowsFinalSummary \
            -only-testing:GanchoUITests/PanelUITests/testPanelShortcutRestoresAndRegistersOnLaunch \
            -only-testing:GanchoUITests/MenuBarKeyEquivalentTests \
            -skip-testing:GanchoUITests/AppQualityUITests/testSettingsNavigationSpanishDark \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/macos-ui.xcresult \
            2>&1 | tee build/macos-ui.log

      - name: Require 23 passing macOS UI tests without skips
        if: always()
        run: |
          ./scripts/collect-ui-test-evidence.sh \
            build/macos-ui.xcresult "macOS UI regressions" build/macos-ui-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/macos-ui-evidence/summary.json').read_text())
          assert summary['result'] == 'Passed', summary
          assert summary['totalTestCount'] == summary['passedTests'] == 23, summary
          assert summary['failedTests'] == summary['skippedTests'] == summary['expectedFailures'] == 0, summary
          PY

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild $XCODE_PACKAGE_FLAGS \
            -project Gancho.xcodeproj -scheme GanchoiOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -resultBundlePath build/ios.xcresult \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/ios-build.log
          ./scripts/check-build-warnings.sh build/ios-build.log

      - name: Preserve macOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-apps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/*.log
            build/*.xcresult
            build/macos-ui-evidence
          retention-days: 14

  # About 14 minutes of simulator boot, a cold build and a warm-up for one
  # check, while the iOS app is not distributed yet: it runs after the merge
  # and on the schedule instead of gating pull requests.
  ios-ui:
    name: iOS suggestion accessibility and toolbar
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: build/xcode-packages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Dependencies/Package.resolved') }}

      # Booting takes about two minutes; it overlaps the build instead.
      - name: Start an available iPhone simulator
        run: |
          ./scripts/warm-ios-simulator.sh --self-test
          runtime=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version) | last | .identifier')
          simulator=$(xcrun simctl list devices available -j \
            | jq -r --arg runtime "$runtime" \
              '.devices[$runtime] | map(select(.name | startswith("iPhone"))) | first | .udid')
          if [[ -z "$runtime" || "$runtime" == "null" || \
                -z "$simulator" || "$simulator" == "null" ]]; then
            echo "::error::No available iOS iPhone simulator was found"
            exit 1
          fi
          echo "IOS_SIMULATOR_UDID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" 2>/dev/null || true

      - name: Generate project
        run: |
          brew install xcodegen
          make project
          ./scripts/collect-ui-test-evidence.sh --self-test

      - name: Build the app and UI test runner
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath build/xcode-packages \
            build-for-testing -project Gancho.xcodeproj -scheme GanchoiOS \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios-reuse-build.log

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b

      - name: Warm the simulator with an unmeasured UI launch
        timeout-minutes: 8
        continue-on-error: true
        run: |
          ./scripts/warm-ios-simulator.sh warm "$IOS_SIMULATOR_UDID" build \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath build/xcode-packages

      - name: Stop anything the warm-up left running
        run: ./scripts/warm-ios-simulator.sh stop "$IOS_SIMULATOR_UDID"

      - name: Run the reuse interaction
        run: |
          set -o pipefail
          xcodebuild -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath build/xcode-packages \
            test-without-building -project Gancho.xcodeproj -scheme GanchoiOS \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -only-testing:GanchoiOSUITests/ReuseSuggestionUITests/testThirdCopyOffersOneTapSnippetPromotionAndCapturesEvidence \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/ios-reuse.xcresult \
            2>&1 | tee build/ios-reuse.log

      - name: Require the passing case without skips
        if: always()
        run: |
          ./scripts/collect-ui-test-evidence.sh \
            build/ios-reuse.xcresult "iOS suggestion accessibility and toolbar" build/ios-reuse-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/ios-reuse-evidence/summary.json').read_text())
          assert summary['result'] == 'Passed', summary
          assert summary['totalTestCount'] == summary['passedTests'] == 1, summary
          assert summary['failedTests'] == summary['skippedTests'] == summary['expectedFailures'] == 0, summary
          PY

      - name: Preserve iOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios-reuse-build.log
            build/ios-warm-up-*.log
            build/ios-warm-up-*.xcresult
            build/ios-reuse.log
            build/ios-reuse.xcresult
            build/ios-reuse-evidence
          retention-days: 14

  # Forward-compat canary: build against the NEXT Xcode/SDK when the runner
  # image carries a beta. Never blocking, never on PRs (weekly + manual only)
  # — betas live exclusively on cloud runners, by repo policy.
  sdk-next-canary:
    name: Xcode beta canary (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode (betas included)
        run: |
          NEWEST=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print \
            | sort -V | tail -1)
          echo "Selected: $NEWEST" | tee -a "$GITHUB_STEP_SUMMARY"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - name: Build everything against the newest SDK
        run: |
          ./scripts/fetch-sparkle.sh
          xcodegen generate
          swift test --disable-automatic-resolution --package-path Packages/GanchoKit
          xcodebuild -disableAutomaticPackageResolution \
            -project Gancho.xcodeproj -scheme Gancho -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
          # iOS too: "everything" excluded half the product, so an iOS-only
          # SDK regression was invisible to the canary whose whole job is
          # seeing one early.
          xcodebuild -disableAutomaticPackageResolution \
            -project Gancho.xcodeproj -scheme GanchoiOS -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
