# Scale performance harness: 100k-row budgets for search, migration, paging,
# and purge. Weekly + manual — seeding 100k rows does not belong in the
# <10-minute PR loop; perf drift is slow, so weekly catches regressions while
# keeping the macOS (x10) spend down. Run on demand with workflow_dispatch.
name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1" # weekly, Monday 07:30 UTC

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Scale budgets (100k clips)
    # Needs the Xcode 26 runner (SDK-26 APIs, iOS 26, and Swift 6.2);
    # the macOS source floor remains 15.4, and macos-latest still lags.
    runs-on: macos-26
    # Seeding 100k rows plus six budget tests runs about four minutes; this
    # only catches a hang.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          {
            echo "### Toolchain"
            sw_vers
            swift --version
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: Packages/GanchoKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/GanchoKit/Package.swift', 'Packages/GanchoKit/Package.resolved') }}

      - name: Run performance harness
        env:
          # The warm search budget relaxes ONLY on GitHub's shared runners,
          # which is where the noise it allows for was measured. Derived from
          # `runner.environment` rather than `CI`: that variable is set by every
          # CI system, says nothing about whether the hardware is shared, and is
          # commonly set to the literal `false`. A self-hosted runner reports
          # `self-hosted` here and so keeps the strict budget.
          GANCHO_PERF_HOSTED_RUNNER: ${{ runner.environment == 'github-hosted' }}
        # GitHub's default `run:` shell is bash WITHOUT pipefail, so
        # `make bench | tee` used to exit with tee's 0 and a failing harness
        # kept the job green (this masked a broken budget test for weeks).
        # Capture the status explicitly so the summary still gets the perf
        # trend lines even when the harness fails, THEN propagate the failure.
        run: |
          set -o pipefail
          status=0
          make bench 2>&1 | tee bench.log || status=$?
          {
            echo "### Performance trends"
            echo '```'
            grep '^perf:' bench.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
