name: App quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-settings:
    name: Interface, navigation and Library regressions
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -un)" = runner
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: build/xcode-packages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Dependencies/Package.resolved') }}

      - name: Generate project and verify dependency locks
        run: |
          brew install xcodegen
          make project
          make dependency-check

      - name: Verify evidence collector
        run: ./scripts/collect-ui-test-evidence.sh --self-test

      - name: Run fourteen isolated interface regressions
        env:
          TEST_RUNNER_GANCHO_UI_ADHOC_SIGNING: "1"
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath build/xcode-packages \
            test -project Gancho.xcodeproj -scheme Gancho \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -only-testing:GanchoUITests/AppQualityUITests \
            -only-testing:GanchoUITests/ProductScreensUITests \
            -only-testing:GanchoUITests/VisualLibraryUITests \
            -only-testing:GanchoUITests/PanelDisplayPreferencesUITests \
            -only-testing:GanchoUITests/LibrarySnippetDraftUITests/testTypedBodySurvivesRefreshAndSavesOnSelectionChange \
            -only-testing:GanchoUITests/LibrarySnippetDraftUITests/testFailedNavigationSaveKeepsEditedSnippet \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/app-quality.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee build/app-quality.log

      - name: Require fourteen passing tests without skips
        if: always()
        run: |
          ./scripts/collect-ui-test-evidence.sh \
            build/app-quality.xcresult "Interface, navigation and Library regressions" build/app-quality-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/app-quality-evidence/summary.json').read_text())
          assert summary['result'] == 'Passed', summary
          assert summary['totalTestCount'] == summary['passedTests'] == 14, summary
          assert summary['failedTests'] == summary['skippedTests'] == summary['expectedFailures'] == 0, summary
          PY

      - name: Preserve application evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-quality-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            build/app-quality.log
            build/app-quality.xcresult
            build/app-quality-evidence
          retention-days: 14
