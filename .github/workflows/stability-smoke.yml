name: Stability smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-settings:
    name: Startup, onboarding and settings (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "26.3"
          - runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -un)" = runner
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: build/xcode-packages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Dependencies/Package.resolved') }}

      - name: Generate project and verify dependency locks
        run: |
          brew install xcodegen
          make project
          make dependency-check

      - name: Verify evidence collector
        run: ./scripts/collect-ui-test-evidence.sh --self-test

      - name: Run nine isolated application regressions
        env:
          TEST_RUNNER_GANCHO_UI_ADHOC_SIGNING: "1"
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath build/xcode-packages \
            test -project Gancho.xcodeproj -scheme Gancho \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -only-testing:GanchoUITests/ActivationFunnelUITests \
            -only-testing:GanchoUITests/SettingsPrivacyUITests \
            -only-testing:GanchoUITests/MigrationImportUITests \
            -only-testing:GanchoUITests/PanelUITests/testPanelShortcutRestoresAndRegistersOnLaunch \
            -only-testing:GanchoUITests/PanelUITests/testSettingsDeepLinkOpensSettingsWindow \
            -only-testing:GanchoUITests/PanelUITests/testMenuBarCommandDeepLinkOpensSettingsWindow \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/stability-smoke.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee build/stability-smoke.log

      - name: Require nine passing tests without skips
        if: always()
        run: |
          ./scripts/collect-ui-test-evidence.sh \
            build/stability-smoke.xcresult "Startup, onboarding and settings" build/stability-smoke-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/stability-smoke-evidence/summary.json').read_text())
          assert summary['result'] == 'Passed', summary
          assert summary['totalTestCount'] == summary['passedTests'] == 9, summary
          assert summary['failedTests'] == summary['skippedTests'] == summary['expectedFailures'] == 0, summary
          PY

      - name: Preserve application evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stability-smoke-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            build/stability-smoke.log
            build/stability-smoke.xcresult
            build/stability-smoke-evidence
          retention-days: 14
