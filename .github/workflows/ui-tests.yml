# Full XCUITest coverage runs outside the pull-request loop because it needs
# signed macOS runners and an iOS Simulator. Every run keeps its raw evidence.
name: UI tests

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full platform suites or ten repetitions of platform interaction regressions
        type: choice
        default: full
        options:
          - full
          - interaction-stress
          - ios-interaction-stress
          - feature-stress
  schedule:
    - cron: "0 8 * * 3" # weekly, Wednesday 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

jobs:
  macos-ui:
    if: ${{ inputs.scope != 'ios-interaction-stress' }}
    name: ${{ inputs.scope == 'feature-stress' && 'macOS feature stress (10x)' || inputs.scope == 'interaction-stress' && 'macOS interaction stress (10x)' || 'macOS UI tests' }}
    runs-on: macos-26
    # Ten rounds exceed the full suite's wall-clock allocation. Interaction
    # timeouts and performance budgets stay unchanged.
    timeout-minutes: ${{ (inputs.scope == 'interaction-stress' || inputs.scope == 'feature-stress') && 90 || 45 }}
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          {
            echo "### macOS UI test toolchain"
            sw_vers
            xcodebuild -version
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - name: Generate project
        run: |
          ./scripts/fetch-sparkle.sh
          xcodegen generate

      - name: Verify evidence collector
        run: ./scripts/collect-ui-test-evidence.sh --self-test

      - name: Run macOS UI tests
        env:
          # TEST_RUNNER_ is stripped by xcodebuild before it reaches XCTest.
          # The one helper-launch assertion needs real Apple Development
          # signing; all in-process menu-bar behavior still runs ad-hoc in CI.
          TEST_RUNNER_GANCHO_UI_ADHOC_SIGNING: "1"
          GANCHO_UI_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          mkdir -p build
          set -o pipefail
          case "$GANCHO_UI_SCOPE" in
            full)
              test_arguments=(-only-testing:GanchoUITests)
              ;;
            feature-stress)
              test_arguments=(-test-iterations 10 \
                -only-testing:GanchoUITests/LibrarySnippetDraftUITests \
                -only-testing:GanchoUITests/VisualLibraryUITests \
                -only-testing:GanchoUITests/ReuseSuggestionUITests \
                -only-testing:GanchoUITests/TranslationCapabilityUITests \
                -only-testing:GanchoUITests/SelectedContextUITests)
              ;;
            interaction-stress)
              test_arguments=(-test-iterations 10)
              for suite in PasteBackUITests ReuseSuggestionUITests \
                ClipLargePreviewUITests ClipTitleEditingUITests PanelBoardUITests \
                PanelReproUITests SourceAppFilterUITests VisualLibraryUITests; do
                test_arguments+=("-only-testing:GanchoUITests/$suite")
              done
              ;;
            *)
              echo "::error::Unsupported UI test scope"
              exit 2
              ;;
          esac
          xcodebuild -disableAutomaticPackageResolution \
            test -project Gancho.xcodeproj -scheme Gancho \
            -destination 'platform=macOS,arch=arm64' \
            "${test_arguments[@]}" \
            -enableCodeCoverage YES \
            -resultBundlePath build/macos-ui.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee build/macos-ui.log

      - name: Collect macOS UI evidence
        if: always()
        env:
          UI_EVIDENCE_LABEL: ${{ inputs.scope == 'feature-stress' && 'macOS feature stress (10x)' || inputs.scope == 'interaction-stress' && 'macOS interaction stress (10x)' || 'macOS UI tests' }}
        run: |
          ./scripts/collect-ui-test-evidence.sh \
            build/macos-ui.xcresult "$UI_EVIDENCE_LABEL" build/macos-ui-evidence

      # The half `swift test` cannot see. Reported, never gated: a UI suite is
      # too environment-sensitive to fail a build on, and a floor nobody can act
      # on is a floor somebody eventually lowers.
      - name: Report macOS app-target coverage
        if: always()
        continue-on-error: true
        env:
          UI_EVIDENCE_LABEL: ${{ inputs.scope == 'feature-stress' && 'macOS feature stress (10x)' || inputs.scope == 'interaction-stress' && 'macOS interaction stress (10x)' || 'macOS UI tests' }}
        run: |
          # pipefail so a broken reporter shows as a failed step
          # instead of inheriting tee's exit 0.
          set -o pipefail
          # A stress subset is not comparable with full-suite coverage.
          echo "Coverage scope: $UI_EVIDENCE_LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/report-apps-coverage.sh build/macos-ui.xcresult \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/macos-ui.xcresult
            build/macos-ui.log
            build/macos-ui-evidence
          if-no-files-found: warn
          retention-days: 14

  ios-ui:
    # Stress is additional evidence, never a replacement for a full platform run.
    if: ${{ inputs.scope != 'interaction-stress' }}
    name: ${{ inputs.scope == 'feature-stress' && 'iOS feature stress (10x)' || inputs.scope == 'ios-interaction-stress' && 'iOS context interaction stress (10x)' || 'iOS UI tests' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          {
            echo "### iOS UI test toolchain"
            sw_vers
            xcodebuild -version
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - name: Generate project
        run: |
          ./scripts/fetch-sparkle.sh
          xcodegen generate

      - name: Select newest available iPhone simulator
        run: |
          runtime=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version) | last | .identifier')
          simulator=$(xcrun simctl list devices available -j \
            | jq -r --arg runtime "$runtime" \
              '.devices[$runtime] | map(select(.name | startswith("iPhone"))) | first | .udid')
          if [[ -z "$runtime" || "$runtime" == "null" || \
                -z "$simulator" || "$simulator" == "null" ]]; then
            echo "::error::No available iOS iPhone simulator was found"
            exit 1
          fi
          echo "Selected runtime: $runtime"
          echo "Selected simulator: $simulator"
          echo "IOS_SIMULATOR_UDID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator" -b

      - name: Run iOS UI tests
        env:
          GANCHO_IOS_UI_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          mkdir -p build
          set -o pipefail
          case "$GANCHO_IOS_UI_SCOPE" in
            full)
              test_arguments=(-only-testing:GanchoiOSUITests)
              ;;
            feature-stress)
              test_arguments=(-test-iterations 10 -only-testing:GanchoiOSUITests/TranslationCapabilityUITests)
              ;;
            ios-interaction-stress)
              test_arguments=(-test-iterations 10 -only-testing:GanchoiOSUITests/OutboundPrivacyUITests)
              ;;
            *)
              echo "::error::Unsupported UI test scope"
              exit 2
              ;;
          esac
          xcodebuild -disableAutomaticPackageResolution \
            test -project Gancho.xcodeproj -scheme GanchoiOS \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            "${test_arguments[@]}" \
            -enableCodeCoverage YES \
            -resultBundlePath build/ios-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios-ui.log

      - name: Collect iOS UI evidence
        if: always()
        env:
          UI_EVIDENCE_LABEL: ${{ inputs.scope == 'feature-stress' && 'iOS feature stress (10x)' || inputs.scope == 'ios-interaction-stress' && 'iOS context interaction stress (10x)' || 'iOS UI tests' }}
        run: |
          ./scripts/collect-ui-test-evidence.sh \
            build/ios-ui.xcresult "$UI_EVIDENCE_LABEL" build/ios-ui-evidence

      - name: Report iOS app-target coverage
        if: always()
        continue-on-error: true
        env:
          UI_EVIDENCE_LABEL: ${{ inputs.scope == 'feature-stress' && 'iOS feature stress (10x)' || inputs.scope == 'ios-interaction-stress' && 'iOS context interaction stress (10x)' || 'iOS UI tests' }}
        run: |
          # pipefail so a broken reporter shows as a failed step
          # instead of inheriting tee's exit 0.
          set -o pipefail
          # A stress subset is not comparable with full-suite coverage.
          echo "Coverage scope: $UI_EVIDENCE_LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/report-apps-coverage.sh build/ios-ui.xcresult \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios-ui.xcresult
            build/ios-ui.log
            build/ios-ui-evidence
          if-no-files-found: warn
          retention-days: 14
